[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edse"
version = "0.1.0"
description = "Earnings Disclosure Signal Engine: LLM-extracted 8-K claims as features in a calibrated post-announcement volatility model."
requires-python = ">=3.10"
dependencies = [
  "anthropic>=1.0",
  "pandas>=2.0",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "requests>=2.31",
  "tenacity>=8.2",
  "yfinance>=0.2.40",
  "matplotlib>=3.8",
  "python-dotenv>=1.0",
  "tqdm>=4.66",
  "lxml>=5.0",
  "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
edse = "edse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
