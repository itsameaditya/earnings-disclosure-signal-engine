# Earnings Disclosure Signal Engine - pipeline configuration.

edgar:
  # 8-K Item 2.02 == "Results of Operations and Financial Condition" (the earnings 8-K).
  required_item: "2.02"
  start_date: "2018-01-01"
  end_date: "2026-09-01"
  # SEC fair-access limit is 10 req/s; we stay well under it.
  requests_per_second: 6.0
  max_exhibit_chars: 120000

extraction:
  # Bulk extractor. Haiku 4.5 is the cost/quality choice for ~1.2k documents;
  # `quality_model` is run on a subset for the model-comparison eval.
  model: "claude-haiku-4-5"
  quality_model: "claude-opus-5"
  # Free local backend via Ollama, so the whole project reproduces at zero cost.
  # num_ctx must exceed system prompt (~1.8k) + document (median ~7.8k tokens);
  # Ollama defaults to 4096, which would silently truncate most releases.
  local_model: "qwen2.5:7b"
  # 32k covers every document in this corpus after narrative trimming
  # (max prepared length ~64k chars ~= 17k tokens), so nothing is silently cut.
  local_num_ctx: 32768
  # Concurrent requests to the local server. Measured on a 16 GiB M4 (11.8 GiB
  # of usable VRAM): 2 slots ran 1.27x the throughput of serial extraction on a
  # controlled benchmark, and 1.52x on corpus windows matched for prompt length
  # (131.0 -> 199.3 prompt tokens/s). Compare throughput, never s/document --
  # this corpus is ordered by issuer, so document length moves more than
  # concurrency does.
  #
  # Memory is what bounds this at 2, not throughput. Ollama preserves
  # `local_num_ctx` *per slot* by scaling total context (`-c 65536 -np 2`), so
  # each added slot costs another ~1.9 GB of KV cache for qwen2.5:7b at 32k.
  # Two slots already sit at ~8.4 GB resident and push a 16 GiB machine into
  # swap on a long run; 3 would reach ~10.3 GB against 11.8 GiB usable and also
  # shrink the physical batch, which makes prefill slower.
  #
  # Do not "fix" the memory pressure by lowering local_num_ctx: it is part of
  # the extraction cache key, so changing it discards every cached extraction
  # and restarts the corpus from zero.
  #
  # This only helps if the server was started with a matching
  # OLLAMA_NUM_PARALLEL; against the default of 1 the requests genuinely do
  # queue, and you pay the added latency for no throughput.
  local_max_workers: 2
  # Safety net for filers whose layout has no recognizable statement header.
  # Trimming alone handles 82% of the corpus; this catches the rest.
  max_document_chars: 70000
  max_tokens: 4096
  temperature: 0.0
  # Concurrency: stay under the API rate limit; extraction is cached on disk,
  # so a re-run after a crash costs nothing for already-extracted filings.
  max_workers: 8
  cache_dir: "data/interim/extractions"

labels:
  # Realized-vol windows in trading days, relative to the event day t0.
  # t0 is the first session that can trade on the news (see labels.py for the
  # acceptance-time rule that handles after-hours releases).
  post_window: 5
  pre_window: 20
  # Binary target: did post-announcement realized vol exceed the pre-announcement
  # baseline by more than this multiple? 1.5 == "50% vol expansion".
  expansion_threshold: 1.5
  # Trading days of price history required on each side; events with gaps are dropped.
  min_pre_obs: 15
  min_post_obs: 5

model:
  # Time-ordered splits only. No shuffling: every fold trains on the past and
  # tests on the future, with an embargo gap to prevent window overlap leakage.
  n_splits: 5
  embargo_days: 10
  test_fraction: 0.2
  calibration_method: "isotonic"
  random_state: 42

eval:
  # Numeric extraction counts as correct within this relative tolerance.
  numeric_rtol: 0.02
  # Self-consistency: repeat extractions at temperature>0 to measure stability
  # without needing gold labels.
  consistency_runs: 3
  consistency_temperature: 1.0
  consistency_sample_size: 40
